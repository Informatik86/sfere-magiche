name: Build
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: sfere-magiche-windows
          path: dist/*.exe
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: AppImage
        run: npx electron-builder --linux AppImage --publish never
      - name: RPM e DEB (extra)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          npx electron-builder --linux rpm deb --publish never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfere-magiche-linux
          path: |
            dist/*.AppImage
            dist/*.rpm
            dist/*.deb
